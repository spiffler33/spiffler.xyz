<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Reader | spiffler.xyz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #0f1624;
            --bg-tertiary: #162033;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #38bdf8;
            --accent-secondary: #22d3ee;
            --border: #1e3a5f;
            --border-hover: #2d5a87;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: pan-y;
        }

        body {
            font-family: 'JetBrains Mono', Monaco, Menlo, monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* --- Layout --- */
        .reader {
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 24px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* --- Chapter bar --- */
        .chapter-bar {
            padding: 16px 0 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Passage area --- */
        .passage-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px 0;
        }

        .passage-text {
            max-width: 700px;
            width: 100%;
            font-size: 0.95rem;
            line-height: 1.85;
            color: var(--text-secondary);
        }

        .passage-text p {
            margin-bottom: 1.2em;
        }
        .passage-text p:last-child {
            margin-bottom: 0;
        }

        /* --- Bottom bar --- */
        .bottom-bar {
            flex-shrink: 0;
            padding: 12px 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .next-hook {
            flex: 1;
            font-size: 0.8rem;
            color: var(--accent-secondary);
            opacity: 0.7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }
        .next-hook:hover { opacity: 1; }

        .position {
            font-size: 0.7rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .bookmark-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text-muted);
            padding: 4px;
            transition: color 150ms;
        }
        .bookmark-btn:hover { color: var(--accent-secondary); }
        .bookmark-btn.active { color: var(--accent-secondary); }

        /* --- Tag --- */
        .tag {
            display: inline-block;
            font-size: 0.65rem;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 1px 6px;
            cursor: pointer;
            transition: border-color 150ms, color 150ms;
            text-decoration: none;
        }
        .tag:hover {
            border-color: var(--accent-secondary);
            color: var(--accent-secondary);
        }

        /* --- Wander / filter bar --- */
        .filter-bar {
            display: none;
            padding: 8px 0;
            font-size: 0.75rem;
            color: var(--text-muted);
            flex-shrink: 0;
            align-items: center;
            gap: 8px;
        }
        .filter-bar.visible { display: flex; }
        .filter-bar a {
            color: var(--accent-secondary);
            text-decoration: none;
            cursor: pointer;
        }
        .filter-bar a:hover { text-decoration: underline; }
        .filter-label {
            color: var(--text-secondary);
        }

        /* --- Mobile nav arrows --- */
        .nav-arrow {
            display: none;
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            padding: 20px 8px;
            cursor: pointer;
            opacity: 0.3;
            z-index: 10;
            transition: opacity 150ms;
        }
        .nav-arrow:active { opacity: 0.7; }
        .nav-prev { left: 0; }
        .nav-next { right: 0; }

        /* --- Loading --- */
        .loading {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* --- Landing (Surface Mode) --- */
        .landing {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
            max-width: 560px;
            margin: 0 auto;
        }

        .featured-card {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 32px 28px;
            background: var(--bg-secondary);
            cursor: pointer;
            transition: border-color 200ms, background 200ms;
        }
        .featured-card:hover {
            border-color: var(--border-hover);
            background: var(--bg-tertiary);
        }

        .featured-title {
            font-size: 1.15rem;
            font-weight: 500;
            color: var(--text-primary);
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .featured-summary {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 16px;
        }

        .featured-tags {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .featured-cta {
            display: inline-block;
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--accent-secondary);
            background: none;
            border: 1px solid var(--accent-secondary);
            border-radius: 4px;
            padding: 8px 20px;
            cursor: pointer;
            transition: background 150ms, color 150ms;
        }
        .featured-cta:hover {
            background: var(--accent-secondary);
            color: var(--bg-primary);
        }

        .landing-secondary {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .landing-link {
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
            transition: color 150ms;
        }
        .landing-link:hover {
            color: var(--text-secondary);
        }

        .resume-strip {
            width: 100%;
            max-width: 560px;
            margin-bottom: 20px;
            padding: 12px 16px;
            font-size: 0.75rem;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .resume-strip-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .resume-strip-btn {
            font-family: inherit;
            font-size: 0.7rem;
            color: var(--accent-secondary);
            background: none;
            border: none;
            cursor: pointer;
            white-space: nowrap;
        }
        .resume-strip-btn:hover { text-decoration: underline; }

        @media (max-width: 600px) {
            .reader { padding: 0 16px; }
            .passage-text { font-size: 0.9rem; line-height: 1.8; }
            .nav-arrow { display: block; }
            .landing { padding: 0 16px; }
            .featured-card { padding: 24px 20px; }
        }

        @media (max-width: 400px) {
            .passage-text { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">loading...</div>

    <div class="landing" id="landing" style="display:none">
        <div class="resume-strip" id="resume-strip" style="display:none">
            <span class="resume-strip-text" id="resume-strip-text"></span>
            <button class="resume-strip-btn" id="resume-btn">Resume</button>
        </div>
        <div class="featured-card" id="featured-card">
            <div class="featured-title" id="featured-title"></div>
            <div class="featured-summary" id="featured-summary"></div>
            <div class="featured-tags" id="featured-tags"></div>
            <button class="featured-cta">Read this</button>
        </div>
        <div class="landing-secondary">
            <button class="landing-link" id="another-btn">Another one</button>
            <button class="landing-link" id="browse-btn">pick your own &rarr;</button>
        </div>
    </div>

    <div class="reader" id="reader" style="display:none">
        <div class="filter-bar" id="filter-bar">
            <span class="filter-label" id="filter-label"></span>
            <a id="filter-exit">&larr; back to sequence</a>
            <span style="margin-left:auto">
                <a id="filter-fav">&#9733; favorites</a>
            </span>
        </div>

        <div class="chapter-bar" id="chapter-bar"></div>

        <div class="passage-area" id="passage-area">
            <div class="passage-text" id="passage-text"></div>
        </div>

        <div class="bottom-bar">
            <div style="display:flex;align-items:center;gap:8px">
                <button class="bookmark-btn" id="bookmark-btn">&#9734;</button>
                <span class="tag" id="system-tag"></span>
            </div>
            <div class="next-hook" id="next-hook"></div>
            <div class="position" id="position"></div>
        </div>

        <button class="nav-arrow nav-prev" id="nav-prev">&lsaquo;</button>
        <button class="nav-arrow nav-next" id="nav-next">&rsaquo;</button>
    </div>

    <script>
    (function () {
        const params = new URLSearchParams(location.search);
        const slug = params.get('book');
        if (!slug) { location.href = '/library/'; return; }

        const KEY_POS = `library-${slug}-pos`;
        const KEY_BM = `library-${slug}-bookmarks`;
        const KEY_HISTORY = `library-${slug}-history`;
        const KEY_LAST_OPEN = `library-${slug}-lastOpen`;

        let passages = [];
        let meta = {};
        let pos = 0;
        let filterMode = null;
        let filteredIds = [];
        let filterPos = 0;
        let savedPos = 0;
        let featuredPassage = null;

        // --- Read History ---
        function getHistory() {
            try { return JSON.parse(localStorage.getItem(KEY_HISTORY) || '[]'); } catch { return []; }
        }
        function addToHistory(id) {
            const h = getHistory();
            h.push({ id, ts: Date.now() });
            localStorage.setItem(KEY_HISTORY, JSON.stringify(h));
        }
        function getReadIds() {
            return new Set(getHistory().map(e => e.id));
        }

        // --- Bookmarks ---
        function getBookmarks() {
            try { return JSON.parse(localStorage.getItem(KEY_BM) || '{}'); } catch { return {}; }
        }
        function setBookmarks(bm) { localStorage.setItem(KEY_BM, JSON.stringify(bm)); }
        function isBookmarked(id) { return !!getBookmarks()[id]; }
        function toggleBookmark(id) {
            const bm = getBookmarks();
            if (bm[id]) delete bm[id]; else bm[id] = true;
            setBookmarks(bm);
        }

        // --- Featured Passage Algorithm ---
        function pickFeatured() {
            const history = getHistory();
            const readIds = getReadIds();
            const lastOpen = parseInt(localStorage.getItem(KEY_LAST_OPEN) || '0', 10);
            const daysSinceOpen = lastOpen ? (Date.now() - lastOpen) / (1000 * 60 * 60 * 24) : 999;

            // First ever visit — passage 1
            if (history.length === 0) {
                return passages[0];
            }

            const unread = passages.filter(p => !readIds.has(p.id));
            if (unread.length === 0) {
                // All read — pick a random one
                return passages[Math.floor(Math.random() * passages.length)];
            }

            // Long absence (7+ days) — pick from a body_system they haven't explored much
            if (daysSinceOpen > 7) {
                const systemCounts = {};
                history.forEach(e => {
                    const p = passages.find(pp => pp.id === e.id);
                    if (p) systemCounts[p.body_system] = (systemCounts[p.body_system] || 0) + 1;
                });
                // Find least-read systems among unread passages
                const unreadSystems = [...new Set(unread.map(p => p.body_system))];
                unreadSystems.sort((a, b) => (systemCounts[a] || 0) - (systemCounts[b] || 0));
                const targetSystem = unreadSystems[0];
                const candidates = unread.filter(p => p.body_system === targetSystem && p.theme === 'narrative');
                if (candidates.length > 0) return candidates[Math.floor(Math.random() * candidates.length)];
                const fallback = unread.filter(p => p.body_system === targetSystem);
                return fallback[Math.floor(Math.random() * fallback.length)];
            }

            // Normal return — weighted toward engaged topics, prefer narrative
            const systemCounts = {};
            const themeCounts = {};
            history.forEach(e => {
                const p = passages.find(pp => pp.id === e.id);
                if (p) {
                    systemCounts[p.body_system] = (systemCounts[p.body_system] || 0) + 1;
                    themeCounts[p.theme] = (themeCounts[p.theme] || 0) + 1;
                }
            });

            // Score unread passages
            const scored = unread.map(p => {
                let score = 1;
                score += (systemCounts[p.body_system] || 0) * 2;
                score += (themeCounts[p.theme] || 0);
                if (p.theme === 'narrative') score += 3;
                // Avoid very recent passages (within last 5 read)
                const recentIds = history.slice(-5).map(e => e.id);
                const pChapter = p.chapter;
                const recentChapters = recentIds.map(id => {
                    const rp = passages.find(pp => pp.id === id);
                    return rp ? rp.chapter : null;
                });
                if (recentChapters.includes(pChapter)) score *= 0.3;
                return { passage: p, score };
            });

            // Weighted random pick
            const totalScore = scored.reduce((s, e) => s + e.score, 0);
            let r = Math.random() * totalScore;
            for (const entry of scored) {
                r -= entry.score;
                if (r <= 0) return entry.passage;
            }
            return scored[scored.length - 1].passage;
        }

        // --- Estimate read time ---
        function estimateMinutes(passage) {
            const words = passage.content.split(/\s+/).length;
            return Math.max(1, Math.round(words / 200));
        }

        // --- Show Landing ---
        function showLanding() {
            featuredPassage = pickFeatured();
            const p = featuredPassage;

            document.getElementById('featured-title').textContent = p.title;
            document.getElementById('featured-summary').textContent = p.summary;
            document.getElementById('featured-tags').textContent =
                `${p.body_system} · ${p.theme} · ~${estimateMinutes(p)} min`;

            // Resume strip
            const savedPosVal = localStorage.getItem(KEY_POS);
            const history = getHistory();
            if (history.length > 0 && savedPosVal !== null) {
                const resumeP = passages[parseInt(savedPosVal, 10)];
                if (resumeP && resumeP.id !== p.id) {
                    document.getElementById('resume-strip-text').textContent =
                        `You were reading: "${resumeP.title}"`;
                    document.getElementById('resume-strip').style.display = 'flex';
                }
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('landing').style.display = 'flex';
        }

        // --- Enter Reader ---
        function enterReader(passageId) {
            const idx = passages.findIndex(p => p.id === passageId);
            if (idx >= 0) pos = idx;

            document.getElementById('landing').style.display = 'none';
            document.getElementById('reader').style.display = 'flex';
            addToHistory(passageId);
            render();
        }

        // --- Load ---
        fetch(`${slug}/passages.json`)
            .then(r => r.json())
            .then(data => {
                meta = data.meta;
                passages = data.passages;
                document.title = `${meta.title} | spiffler.xyz`;

                const saved = localStorage.getItem(KEY_POS);
                pos = saved ? Math.min(parseInt(saved, 10), passages.length - 1) : 0;

                // Migrate: seed history from existing position if needed
                const history = getHistory();
                if (history.length === 0 && saved !== null && parseInt(saved, 10) > 0) {
                    // They had progress in old schema — seed history with passages up to saved pos
                    for (let i = 0; i <= Math.min(parseInt(saved, 10), passages.length - 1); i++) {
                        addToHistory(passages[i].id);
                    }
                }

                showLanding();
                localStorage.setItem(KEY_LAST_OPEN, Date.now().toString());
            })
            .catch(() => {
                document.getElementById('loading').textContent = 'book not found';
            });

        // --- Landing events ---
        document.getElementById('featured-card').addEventListener('click', () => {
            if (featuredPassage) enterReader(featuredPassage.id);
        });

        document.getElementById('another-btn').addEventListener('click', () => {
            featuredPassage = pickFeatured();
            const p = featuredPassage;
            document.getElementById('featured-title').textContent = p.title;
            document.getElementById('featured-summary').textContent = p.summary;
            document.getElementById('featured-tags').textContent =
                `${p.body_system} · ${p.theme} · ~${estimateMinutes(p)} min`;
        });

        document.getElementById('resume-btn').addEventListener('click', () => {
            const savedPosVal = localStorage.getItem(KEY_POS);
            if (savedPosVal !== null) {
                const resumeP = passages[parseInt(savedPosVal, 10)];
                if (resumeP) enterReader(resumeP.id);
            }
        });

        document.getElementById('browse-btn').addEventListener('click', () => {
            // For now, enter reader at current position (browse mode comes later)
            enterReader(passages[pos].id);
        });

        // --- Render ---
        function currentPassage() {
            if (filterMode) {
                return passages.find(p => p.id === filteredIds[filterPos]);
            }
            return passages[pos];
        }

        function currentIndex() {
            return filterMode ? filterPos : pos;
        }

        function currentTotal() {
            return filterMode ? filteredIds.length : passages.length;
        }

        function render() {
            const p = currentPassage();
            if (!p) return;

            // Chapter bar
            document.getElementById('chapter-bar').textContent = p.chapter;

            // Passage text
            const area = document.getElementById('passage-area');
            const textEl = document.getElementById('passage-text');
            const html = p.content.split('\n').filter(s => s.trim())
                .map(para => `<p>${escapeHtml(para)}</p>`).join('');
            textEl.innerHTML = html;
            area.scrollTop = 0;

            // Next hook
            const nextHookEl = document.getElementById('next-hook');
            const ni = currentIndex() + 1;
            if (ni < currentTotal()) {
                const nextP = filterMode
                    ? passages.find(pp => pp.id === filteredIds[ni])
                    : passages[ni];
                nextHookEl.textContent = nextP ? nextP.title : '';
            } else {
                nextHookEl.textContent = filterMode ? 'end of filter' : 'fin';
            }

            // Position — no denominators, just a subtle marker
            document.getElementById('position').textContent = '';

            // Bookmark
            const bmBtn = document.getElementById('bookmark-btn');
            bmBtn.innerHTML = isBookmarked(p.id) ? '&#9733;' : '&#9734;';
            bmBtn.classList.toggle('active', isBookmarked(p.id));

            // Tag
            document.getElementById('system-tag').textContent = p.body_system;

            // Filter bar
            const fb = document.getElementById('filter-bar');
            if (filterMode) {
                fb.classList.add('visible');
                const label = filterMode === 'favorites' ? '&#9733; favorites' : filterMode.replace('system:', '');
                document.getElementById('filter-label').innerHTML = label;
                document.getElementById('filter-fav').style.display = filterMode === 'favorites' ? 'none' : '';
            } else {
                fb.classList.remove('visible');
            }

            // Save position
            if (!filterMode) {
                localStorage.setItem(KEY_POS, pos);
            }
        }

        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // --- Navigation ---
        function go(delta) {
            if (filterMode) {
                filterPos = Math.max(0, Math.min(filterPos + delta, filteredIds.length - 1));
            } else {
                pos = Math.max(0, Math.min(pos + delta, passages.length - 1));
            }
            const p = currentPassage();
            if (p) addToHistory(p.id);
            render();
        }

        // --- Filter / Wander ---
        function enterFilter(mode) {
            savedPos = pos;
            filterMode = mode;

            if (mode === 'favorites') {
                const bm = getBookmarks();
                filteredIds = passages.filter(p => bm[p.id]).map(p => p.id);
            } else {
                const system = mode.replace('system:', '');
                filteredIds = passages.filter(p => p.body_system === system).map(p => p.id);
            }

            filterPos = 0;
            if (filteredIds.length === 0) {
                exitFilter();
                return;
            }
            render();
        }

        function exitFilter() {
            filterMode = null;
            filteredIds = [];
            filterPos = 0;
            pos = savedPos;
            render();
        }

        // --- Events ---

        // Keyboard
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight' || e.key === 'k') go(1);
            else if (e.key === 'ArrowLeft' || e.key === 'j') go(-1);
            else if (e.key === 'b') {
                toggleBookmark(currentPassage().id);
                render();
            }
        });

        // Click left/right halves (desktop)
        document.getElementById('passage-area').addEventListener('click', e => {
            const rect = e.currentTarget.getBoundingClientRect();
            const x = e.clientX - rect.left;
            if (x > rect.width * 0.5) go(1);
            else go(-1);
        });

        // Mobile arrows
        document.getElementById('nav-prev').addEventListener('click', e => { e.stopPropagation(); go(-1); });
        document.getElementById('nav-next').addEventListener('click', e => { e.stopPropagation(); go(1); });

        // Next hook click
        document.getElementById('next-hook').addEventListener('click', () => go(1));

        // Swipe
        let touchStartX = 0;
        document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
        document.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
        });

        // Bookmark
        document.getElementById('bookmark-btn').addEventListener('click', e => {
            e.stopPropagation();
            toggleBookmark(currentPassage().id);
            render();
        });

        // Tag → wander
        document.getElementById('system-tag').addEventListener('click', e => {
            e.stopPropagation();
            const p = currentPassage();
            if (p) enterFilter('system:' + p.body_system);
        });

        // Filter bar actions
        document.getElementById('filter-exit').addEventListener('click', exitFilter);
        document.getElementById('filter-fav').addEventListener('click', () => enterFilter('favorites'));
    })();
    </script>
</body>
</html>
