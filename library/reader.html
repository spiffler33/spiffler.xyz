<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Reader | spiffler.xyz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #0f1624;
            --bg-tertiary: #162033;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #38bdf8;
            --accent-secondary: #22d3ee;
            --border: #1e3a5f;
            --border-hover: #2d5a87;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: pan-y;
        }

        body {
            font-family: 'JetBrains Mono', Monaco, Menlo, monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* --- Loading --- */
        .loading {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* --- Landing --- */
        .landing {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
            max-width: 560px;
            margin: 0 auto;
        }

        .featured-card {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 32px 28px;
            background: var(--bg-secondary);
            cursor: pointer;
            transition: border-color 200ms, background 200ms;
        }
        .featured-card:hover {
            border-color: var(--border-hover);
            background: var(--bg-tertiary);
        }

        .featured-title {
            font-size: 1.15rem;
            font-weight: 500;
            color: var(--text-primary);
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .featured-summary {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 16px;
        }

        .featured-tags {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .featured-cta {
            display: inline-block;
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--accent-secondary);
            background: none;
            border: 1px solid var(--accent-secondary);
            border-radius: 4px;
            padding: 8px 20px;
            cursor: pointer;
            transition: background 150ms, color 150ms;
        }
        .featured-cta:hover {
            background: var(--accent-secondary);
            color: var(--bg-primary);
        }

        .landing-secondary {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .landing-link {
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
            transition: color 150ms;
        }
        .landing-link:hover {
            color: var(--text-secondary);
        }

        /* --- Settings View --- */
        .settings-view {
            height: 100%;
            display: flex;
            flex-direction: column;
            max-width: 560px;
            margin: 0 auto;
            padding: 48px 24px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .settings-back {
            font-family: inherit;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: none;
            border: none;
            cursor: pointer;
            margin-bottom: 24px;
            padding: 0;
        }
        .settings-back:hover { color: var(--text-secondary); }
        .settings-heading {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }
        .settings-section { margin-bottom: 24px; }
        .settings-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .settings-font-row {
            display: flex;
            gap: 8px;
        }
        .settings-font-btn {
            font-family: inherit;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: none;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px 16px;
            cursor: pointer;
            transition: border-color 200ms, color 200ms;
        }
        .settings-font-btn:hover {
            border-color: var(--border-hover);
            color: var(--text-secondary);
        }
        .settings-font-btn.active {
            border-color: var(--accent-secondary);
            color: var(--accent-secondary);
        }
        /* Toggle switch */
        .settings-toggle-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
        }
        .settings-toggle-text {
            flex: 1;
        }
        .settings-toggle-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .settings-toggle-sub {
            font-size: 0.7rem;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .toggle-switch {
            position: relative;
            width: 40px;
            height: 22px;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-track {
            position: absolute;
            inset: 0;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 11px;
            cursor: pointer;
            transition: background 200ms, border-color 200ms;
        }
        .toggle-track::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 14px;
            height: 14px;
            background: var(--text-muted);
            border-radius: 50%;
            transition: transform 200ms, background 200ms;
        }
        .toggle-switch input:checked + .toggle-track {
            background: rgba(34, 211, 238, 0.15);
            border-color: var(--accent-secondary);
        }
        .toggle-switch input:checked + .toggle-track::after {
            transform: translateX(18px);
            background: var(--accent-secondary);
        }

        .settings-reset-btn {
            font-family: inherit;
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: none;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px 24px;
            cursor: pointer;
            transition: border-color 200ms, color 200ms;
        }
        .settings-reset-btn:hover {
            border-color: #ef4444;
            color: #ef4444;
        }
        .settings-reset-note {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 8px;
            line-height: 1.5;
        }

        /* --- Reader --- */
        .reader {
            height: 100%;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
        }

        .reader-header {
            padding: 16px 24px 0;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
            flex-shrink: 0;
            opacity: 0.6;
        }

        .passage-area {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 24px 24px 0;
        }

        .passage-text {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            font-size: 0.95rem;
            line-height: 1.85;
            color: var(--text-secondary);
            transition: opacity 300ms ease;
        }

        .passage-text.fading { opacity: 0; }

        .passage-text p {
            margin-bottom: 1.2em;
        }
        .passage-text p:last-child {
            margin-bottom: 0;
        }

        /* --- Post-passage flow --- */
        .post-passage {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            padding: 48px 0 80px;
            display: none;
        }

        .post-passage.visible {
            display: block;
        }

        .post-divider {
            width: 40px;
            height: 1px;
            background: var(--border);
            margin: 0 auto 32px;
        }

        .post-btn {
            display: block;
            width: 100%;
            text-align: left;
            font-family: inherit;
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px 20px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: border-color 200ms, background 200ms;
        }
        .post-btn:hover {
            border-color: var(--border-hover);
            background: var(--bg-secondary);
        }

        .post-btn-primary {
            border-color: var(--accent-secondary);
        }
        .post-btn-primary:hover {
            background: rgba(34, 211, 238, 0.06);
            border-color: var(--accent-secondary);
        }

        .post-btn-label {
            font-size: 0.85rem;
            color: var(--accent-secondary);
            margin-bottom: 4px;
        }
        .post-btn:not(.post-btn-primary) .post-btn-label {
            color: var(--text-secondary);
        }

        .post-btn-detail {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .post-btn-done .post-btn-label {
            color: var(--text-muted);
        }

        /* --- Completion Card --- */
        .completion {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
            max-width: 480px;
            margin: 0 auto;
            text-align: center;
        }

        .completion-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .completion-actions {
            display: flex;
            gap: 16px;
        }

        .completion-btn {
            font-family: inherit;
            font-size: 0.8rem;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 150ms, color 150ms, border-color 150ms;
        }

        .completion-btn-save {
            color: var(--accent-secondary);
            background: none;
            border: 1px solid var(--accent-secondary);
        }
        .completion-btn-save:hover {
            background: var(--accent-secondary);
            color: var(--bg-primary);
        }

        .completion-btn-home {
            color: var(--text-muted);
            background: none;
            border: 1px solid var(--border);
        }
        .completion-btn-home:hover {
            border-color: var(--border-hover);
            color: var(--text-secondary);
        }

        /* --- Save a line --- */
        .save-line-btn {
            display: block;
            width: 100%;
            text-align: left;
            font-family: inherit;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px 20px;
            margin-top: 6px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: border-color 200ms, color 200ms;
        }
        .save-line-btn:hover {
            border-color: var(--border-hover);
            color: var(--text-secondary);
        }
        .save-line-btn.saved {
            color: var(--text-muted);
            opacity: 0.5;
            pointer-events: none;
        }

        /* --- My Anthology view --- */
        .anthology-view {
            height: 100%;
            display: flex;
            flex-direction: column;
            max-width: 600px;
            margin: 0 auto;
            padding: 48px 24px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .anthology-heading {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .anthology-empty {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.7;
        }

        .anthology-item {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: border-color 200ms, background 200ms;
        }
        .anthology-item:hover {
            border-color: var(--border-hover);
            background: var(--bg-secondary);
        }

        .anthology-item-title {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .anthology-item-line {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.7;
            font-style: italic;
        }

        .anthology-item-meta {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 8px;
            opacity: 0.6;
        }

        .anthology-back {
            font-family: inherit;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: none;
            border: none;
            cursor: pointer;
            margin-bottom: 24px;
            padding: 0;
        }
        .anthology-back:hover { color: var(--text-secondary); }

        @media (max-width: 600px) {
            .passage-area { padding: 20px 16px 0; }
            .passage-text { font-size: 0.9rem; line-height: 1.8; }
            .reader-header { padding: 14px 16px 0; }
            .landing { padding: 0 16px; }
            .featured-card { padding: 24px 20px; }
            .completion { padding: 0 16px; }
            .anthology-view { padding: 40px 16px; }
            .settings-view { padding: 40px 16px; }
        }

        @media (max-width: 400px) {
            .passage-text { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">loading...</div>

    <div class="landing" id="landing" style="display:none">
        <div class="featured-card" id="featured-card">
            <div class="featured-title" id="featured-title"></div>
            <div class="featured-summary" id="featured-summary"></div>
            <div class="featured-tags" id="featured-tags"></div>
            <button class="featured-cta">Read this</button>
        </div>
        <div class="landing-secondary">
            <button class="landing-link" id="skip-chapter-btn" style="display:none">skip to next chapter &rarr;</button>
            <button class="landing-link" id="anthology-btn">my anthology</button>
            <button class="landing-link" id="settings-btn">settings</button>
        </div>
    </div>

    <div class="reader" id="reader" style="display:none">
        <div class="reader-header" id="reader-header"></div>
        <div class="passage-area" id="passage-area">
            <div class="passage-text" id="passage-text"></div>
            <div class="post-passage" id="post-passage">
                <div class="post-divider"></div>
                <button class="post-btn post-btn-primary" id="post-primary">
                    <div class="post-btn-label" id="post-primary-label"></div>
                    <div class="post-btn-detail" id="post-primary-detail"></div>
                </button>
                <button class="post-btn post-btn-done" id="post-done">
                    <div class="post-btn-label">Done for now</div>
                </button>
                <button class="save-line-btn" id="post-save-line">Save this passage</button>
            </div>
        </div>
    </div>

    <div class="completion" id="completion" style="display:none">
        <div class="completion-text" id="completion-text"></div>
        <div class="completion-actions">
            <button class="completion-btn completion-btn-save" id="completion-save">Save a line</button>
            <button class="completion-btn completion-btn-home" id="completion-home">Home</button>
        </div>
    </div>

    <div class="settings-view" id="settings-view" style="display:none">
        <button class="settings-back" id="settings-back">&larr; back</button>
        <div class="settings-heading">Settings</div>
        <div class="settings-section">
            <div class="settings-label">Font size</div>
            <div class="settings-font-row" id="settings-font-row">
                <button class="settings-font-btn" data-size="small">Small</button>
                <button class="settings-font-btn" data-size="medium">Medium</button>
                <button class="settings-font-btn" data-size="large">Large</button>
            </div>
        </div>
        <div class="settings-section">
            <div class="settings-toggle-row">
                <div class="settings-toggle-text">
                    <div class="settings-toggle-label">Show all passages</div>
                    <div class="settings-toggle-sub">Include detailed medical and historical passages</div>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="settings-complete-toggle">
                    <span class="toggle-track"></span>
                </label>
            </div>
        </div>
        <div class="settings-section" style="margin-top: 40px;">
            <button class="settings-reset-btn" id="settings-reset">Start fresh</button>
            <div class="settings-reset-note">Resets your reading position. Saved passages are kept.</div>
        </div>
    </div>

    <div class="anthology-view" id="anthology-view" style="display:none">
        <button class="anthology-back" id="anthology-back">&larr; back</button>
        <div class="anthology-heading">Passages that stuck</div>
        <div id="anthology-list"></div>
    </div>


    <script>
    (function () {
        const params = new URLSearchParams(location.search);
        const slug = params.get('book');
        if (!slug) { location.href = '/library/'; return; }

        const KEY_POS = `library-${slug}-pos`;
        const KEY_BM = `library-${slug}-bookmarks`;
        const KEY_HISTORY = `library-${slug}-history`;
        const KEY_LAST_OPEN = `library-${slug}-lastOpen`;
        const KEY_SAVED = `library-${slug}-saved`;
        const KEY_FONT = `library-${slug}-font`;
        const KEY_MODE = `library-${slug}-mode`;
        let allPassages = [];
        let passages = [];
        let meta = {};
        let pos = 0;
        let featuredPassage = null;

        function isCompleteMode() {
            return localStorage.getItem(KEY_MODE) === 'complete';
        }
        function setCompleteMode(on) {
            if (on) localStorage.setItem(KEY_MODE, 'complete');
            else localStorage.removeItem(KEY_MODE);
            rebuildPassages();
        }
        function rebuildPassages() {
            if (isCompleteMode()) {
                passages = allPassages;
            } else {
                passages = allPassages.filter(p => p.priority === 'essential');
            }
        }

        // --- Read History ---
        function getHistory() {
            try { return JSON.parse(localStorage.getItem(KEY_HISTORY) || '[]'); } catch { return []; }
        }
        function addToHistory(id) {
            const h = getHistory();
            h.push({ id, ts: Date.now() });
            localStorage.setItem(KEY_HISTORY, JSON.stringify(h));
        }
        function getReadIds() {
            return new Set(getHistory().map(e => e.id));
        }

        // --- Saved Passages (Anthology) ---
        function getSavedPassages() {
            try { return JSON.parse(localStorage.getItem(KEY_SAVED) || '[]'); } catch { return []; }
        }
        function setSavedPassages(sp) { localStorage.setItem(KEY_SAVED, JSON.stringify(sp)); }
        function savePassage(passageId, savedLine) {
            const sp = getSavedPassages();
            if (sp.some(e => e.passageId === passageId)) return false;
            sp.push({ passageId, savedLine: savedLine || null, ts: Date.now() });
            setSavedPassages(sp);
            return true;
        }
        function isPassageSaved(passageId) {
            return getSavedPassages().some(e => e.passageId === passageId);
        }

        // --- Migrate bookmarks ---
        function migrateBookmarks() {
            let bm;
            try { bm = JSON.parse(localStorage.getItem(KEY_BM) || '{}'); } catch { bm = {}; }
            const ids = Object.keys(bm).filter(k => bm[k]);
            if (ids.length === 0) return;
            const sp = getSavedPassages();
            const existingIds = new Set(sp.map(e => e.passageId));
            let migrated = false;
            ids.forEach(idStr => {
                const id = parseInt(idStr, 10);
                if (!existingIds.has(id)) {
                    sp.push({ passageId: id, savedLine: null, ts: Date.now() });
                    migrated = true;
                }
            });
            if (migrated) setSavedPassages(sp);
            localStorage.removeItem(KEY_BM);
        }

        // --- Pick next unread passage (always sequential) ---
        function pickNextUnread() {
            const readIds = getReadIds();
            if (readIds.size === 0) return passages[0];

            const unread = passages.filter(p => !readIds.has(p.id));
            if (unread.length === 0) return passages[0];

            return unread[0];
        }

        // --- Find first passage of the next chapter ---
        function findNextChapterStart(currentPassage) {
            const currentChapter = currentPassage.chapter;
            for (let i = 0; i < passages.length; i++) {
                if (passages[i].chapter !== currentChapter && passages[i].id > currentPassage.id) {
                    return passages[i];
                }
            }
            return null;
        }

        function estimateMinutes(passage) {
            const words = passage.content.split(/\s+/).length;
            return Math.max(1, Math.round(words / 200));
        }

        function crossfadeTo(renderFn) {
            const textEl = document.getElementById('passage-text');
            textEl.classList.add('fading');
            setTimeout(() => { renderFn(); textEl.classList.remove('fading'); }, 300);
        }

        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // --- Font size ---
        function applyFontSize() {
            const size = localStorage.getItem(KEY_FONT) || 'medium';
            const map = { small: '0.85rem', medium: '0.95rem', large: '1.1rem' };
            document.querySelectorAll('.passage-text').forEach(el => {
                el.style.fontSize = map[size] || map.medium;
            });
        }

        // --- Show/hide views ---
        function hideAll() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('landing').style.display = 'none';
            document.getElementById('reader').style.display = 'none';
            document.getElementById('completion').style.display = 'none';
            document.getElementById('anthology-view').style.display = 'none';
            document.getElementById('settings-view').style.display = 'none';
        }

        // --- Show Landing ---
        function showLanding() {
            featuredPassage = pickNextUnread();
            const p = featuredPassage;

            document.getElementById('featured-title').textContent = p.title;
            document.getElementById('featured-summary').textContent = p.summary;
            document.getElementById('featured-tags').textContent =
                `${p.chapter} · ~${estimateMinutes(p)} min`;

            // Show "skip to next chapter" if current passage isn't the start of a main chapter
            const skipBtn = document.getElementById('skip-chapter-btn');
            const nextChapter = findNextChapterStart(p);
            if (nextChapter) {
                skipBtn.style.display = '';
                skipBtn.textContent = `skip to ${nextChapter.chapter} \u2192`;
                skipBtn.onclick = () => {
                    // Mark all passages in current chapter as read
                    const currentChapter = p.chapter;
                    passages.forEach(pp => {
                        if (pp.chapter === currentChapter) addToHistory(pp.id);
                    });
                    enterReader(nextChapter.id);
                };
            } else {
                skipBtn.style.display = 'none';
            }

            hideAll();
            document.getElementById('landing').style.display = 'flex';
        }

        // --- Enter Reader ---
        function enterReader(passageId) {
            const idx = passages.findIndex(p => p.id === passageId);
            if (idx >= 0) pos = idx;

            hideAll();
            document.getElementById('reader').style.display = 'flex';
            addToHistory(passageId);
            renderPassage();
        }

        // --- Render passage ---
        function renderPassage() {
            const p = passages[pos];
            if (!p) return;

            document.getElementById('reader-header').textContent = p.chapter;

            const textEl = document.getElementById('passage-text');
            const html = p.content.split('\n').filter(s => s.trim())
                .map(para => `<p>${escapeHtml(para)}</p>`).join('');
            textEl.innerHTML = html;

            // Post-passage: next unread in active list
            const readIds = getReadIds();
            let next = null;
            for (let i = pos + 1; i < passages.length; i++) {
                if (!readIds.has(passages[i].id)) { next = passages[i]; break; }
            }
            if (!next && pos + 1 < passages.length) next = passages[pos + 1];

            const postEl = document.getElementById('post-passage');
            postEl.classList.add('visible');

            const primaryBtn = document.getElementById('post-primary');
            if (next) {
                primaryBtn.style.display = '';
                document.getElementById('post-primary-label').textContent = 'Continue \u2192';
                document.getElementById('post-primary-detail').textContent =
                    `${next.title} \xb7 ~${estimateMinutes(next)} min`;
            } else {
                primaryBtn.style.display = 'none';
            }

            updateSaveBtn(document.getElementById('post-save-line'), p.id);

            document.getElementById('passage-area').scrollTop = 0;
            localStorage.setItem(KEY_POS, pos);
            applyFontSize();
        }

        // --- Show Completion Card ---
        function showCompletion() {
            const readIds = getReadIds();
            const activeIds = new Set(passages.map(p => p.id));
            let readCount = 0;
            readIds.forEach(id => { if (activeIds.has(id)) readCount++; });
            document.getElementById('completion-text').textContent =
                `Nice. ${readCount} passage${readCount !== 1 ? 's' : ''} so far.`;

            const p = passages[pos];
            const saveBtn = document.getElementById('completion-save');
            if (isPassageSaved(p.id)) {
                saveBtn.textContent = 'Saved';
                saveBtn.style.opacity = '0.5';
                saveBtn.style.pointerEvents = 'none';
            } else {
                saveBtn.textContent = 'Save a line';
                saveBtn.style.opacity = '1';
                saveBtn.style.pointerEvents = 'auto';
            }

            hideAll();
            document.getElementById('completion').style.display = 'flex';
        }

        // --- Show Anthology ---
        function showAnthology() {
            const saved = getSavedPassages();
            const listEl = document.getElementById('anthology-list');

            if (saved.length === 0) {
                listEl.innerHTML = '<div class="anthology-empty">Nothing saved yet. After reading a passage, tap "Save this passage" to add it here.</div>';
            } else {
                const items = [...saved].reverse();
                listEl.innerHTML = items.map(entry => {
                    const p = allPassages.find(pp => pp.id === entry.passageId);
                    if (!p) return '';
                    const line = entry.savedLine
                        ? `<div class="anthology-item-line">"${escapeHtml(entry.savedLine)}"</div>`
                        : `<div class="anthology-item-line">${escapeHtml(p.summary)}</div>`;
                    const date = new Date(entry.ts);
                    const dateStr = date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
                    return `<div class="anthology-item" data-passage-id="${p.id}">
                        <div class="anthology-item-title">${escapeHtml(p.title)}</div>
                        ${line}
                        <div class="anthology-item-meta">saved ${dateStr}</div>
                    </div>`;
                }).join('');

                listEl.querySelectorAll('.anthology-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const id = parseInt(el.dataset.passageId, 10);
                        enterReader(id);
                    });
                });
            }

            hideAll();
            document.getElementById('anthology-view').style.display = 'flex';
        }

        // --- Show Settings ---
        function showSettings() {
            const currentFont = localStorage.getItem(KEY_FONT) || 'medium';
            document.querySelectorAll('.settings-font-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.size === currentFont);
            });
            document.getElementById('settings-complete-toggle').checked = isCompleteMode();
            hideAll();
            document.getElementById('settings-view').style.display = 'flex';
        }

        function updateSaveBtn(btnEl, passageId) {
            if (isPassageSaved(passageId)) {
                btnEl.textContent = 'Saved';
                btnEl.classList.add('saved');
            } else {
                btnEl.textContent = 'Save this passage';
                btnEl.classList.remove('saved');
            }
        }

        // --- Load ---
        fetch(`${slug}/passages.json`)
            .then(r => r.json())
            .then(data => {
                meta = data.meta;
                allPassages = data.passages;
                rebuildPassages();
                document.title = `${meta.title} | spiffler.xyz`;

                // Restore position by passage ID (not index, since filtered list changes)
                const savedPos = localStorage.getItem(KEY_POS);
                if (savedPos !== null) {
                    const savedIdx = parseInt(savedPos, 10);
                    // Old format stored index into allPassages; find that passage in current list
                    const savedPassage = allPassages[savedIdx];
                    if (savedPassage) {
                        const filteredIdx = passages.findIndex(p => p.id === savedPassage.id);
                        pos = filteredIdx >= 0 ? filteredIdx : 0;
                    } else {
                        pos = 0;
                    }
                } else {
                    pos = 0;
                }

                const history = getHistory();
                if (history.length === 0 && savedPos !== null && parseInt(savedPos, 10) > 0) {
                    for (let i = 0; i <= Math.min(parseInt(savedPos, 10), allPassages.length - 1); i++) {
                        addToHistory(allPassages[i].id);
                    }
                }

                migrateBookmarks();
                applyFontSize();
                showLanding();
                localStorage.setItem(KEY_LAST_OPEN, Date.now().toString());
            })
            .catch(() => {
                document.getElementById('loading').textContent = 'book not found';
            });

        // --- Landing events ---
        document.getElementById('featured-card').addEventListener('click', () => {
            if (featuredPassage) enterReader(featuredPassage.id);
        });

        document.getElementById('anthology-btn').addEventListener('click', () => {
            showAnthology();
        });

        document.getElementById('settings-btn').addEventListener('click', () => {
            showSettings();
        });

        document.getElementById('anthology-back').addEventListener('click', () => {
            showLanding();
        });

        // --- Settings events ---
        document.getElementById('settings-back').addEventListener('click', () => {
            showLanding();
        });

        document.querySelectorAll('.settings-font-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                localStorage.setItem(KEY_FONT, btn.dataset.size);
                document.querySelectorAll('.settings-font-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                applyFontSize();
            });
        });

        document.getElementById('settings-complete-toggle').addEventListener('change', (e) => {
            setCompleteMode(e.target.checked);
            // Reposition: find next unread in new mode
            const readIds = getReadIds();
            const unread = passages.filter(p => !readIds.has(p.id));
            if (unread.length > 0) {
                pos = passages.findIndex(p => p.id === unread[0].id);
            } else {
                pos = 0;
            }
        });

        document.getElementById('settings-reset').addEventListener('click', () => {
            if (confirm('This resets your reading position. Your saved passages are kept. Start over?')) {
                localStorage.removeItem(KEY_HISTORY);
                localStorage.removeItem(KEY_POS);
                localStorage.removeItem(KEY_MODE);
                rebuildPassages();
                pos = 0;
                showLanding();
            }
        });

        // --- Post-passage events ---
        document.getElementById('post-primary').addEventListener('click', (e) => {
            e.stopPropagation();
            const readIds = getReadIds();
            // Find next unread in active list after current pos
            let nextIdx = -1;
            for (let i = pos + 1; i < passages.length; i++) {
                if (!readIds.has(passages[i].id)) { nextIdx = i; break; }
            }
            // If none found after current, just take pos+1
            if (nextIdx < 0 && pos + 1 < passages.length) nextIdx = pos + 1;
            if (nextIdx >= 0) {
                pos = nextIdx;
                addToHistory(passages[pos].id);
                crossfadeTo(() => renderPassage());
            }
        });

        document.getElementById('post-done').addEventListener('click', (e) => {
            e.stopPropagation();
            showCompletion();
        });

        document.getElementById('post-save-line').addEventListener('click', (e) => {
            e.stopPropagation();
            const p = passages[pos];
            if (p) {
                savePassage(p.id, null);
                updateSaveBtn(document.getElementById('post-save-line'), p.id);
            }
        });

        // --- Completion events ---
        document.getElementById('completion-save').addEventListener('click', () => {
            const p = passages[pos];
            if (p) {
                savePassage(p.id, null);
                document.getElementById('completion-save').textContent = 'Saved';
                document.getElementById('completion-save').style.opacity = '0.5';
                document.getElementById('completion-save').style.pointerEvents = 'none';
            }
        });

        document.getElementById('completion-home').addEventListener('click', () => {
            showLanding();
        });

        // --- Keyboard ---
        document.addEventListener('keydown', e => {
            if (document.getElementById('reader').style.display === 'none') return;
            if (e.key === 'Escape') {
                showCompletion();
            }
        });
    })();
    </script>
</body>
</html>
