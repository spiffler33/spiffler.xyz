<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Reader | spiffler.xyz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #0f1624;
            --bg-tertiary: #162033;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #38bdf8;
            --accent-secondary: #22d3ee;
            --border: #1e3a5f;
            --border-hover: #2d5a87;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: pan-y;
        }

        body {
            font-family: 'JetBrains Mono', Monaco, Menlo, monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* --- Loading --- */
        .loading {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* --- Landing (Surface Mode) --- */
        .landing {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
            max-width: 560px;
            margin: 0 auto;
        }

        .featured-card {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 32px 28px;
            background: var(--bg-secondary);
            cursor: pointer;
            transition: border-color 200ms, background 200ms;
        }
        .featured-card:hover {
            border-color: var(--border-hover);
            background: var(--bg-tertiary);
        }

        .featured-title {
            font-size: 1.15rem;
            font-weight: 500;
            color: var(--text-primary);
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .featured-summary {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 16px;
        }

        .featured-tags {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .featured-cta {
            display: inline-block;
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--accent-secondary);
            background: none;
            border: 1px solid var(--accent-secondary);
            border-radius: 4px;
            padding: 8px 20px;
            cursor: pointer;
            transition: background 150ms, color 150ms;
        }
        .featured-cta:hover {
            background: var(--accent-secondary);
            color: var(--bg-primary);
        }

        .landing-secondary {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .landing-link {
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
            transition: color 150ms;
        }
        .landing-link:hover {
            color: var(--text-secondary);
        }

        .resume-strip {
            width: 100%;
            max-width: 560px;
            margin-bottom: 20px;
            padding: 12px 16px;
            font-size: 0.75rem;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .resume-strip-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .resume-strip-btn {
            font-family: inherit;
            font-size: 0.7rem;
            color: var(--accent-secondary);
            background: none;
            border: none;
            cursor: pointer;
            white-space: nowrap;
        }
        .resume-strip-btn:hover { text-decoration: underline; }

        /* --- Reader (Immersion Mode) --- */
        .reader {
            height: 100%;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
        }

        .reader-header {
            padding: 16px 24px 0;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
            flex-shrink: 0;
            opacity: 0.6;
            transition: opacity 400ms, max-height 400ms, padding 400ms;
            max-height: 50px;
            overflow: hidden;
        }

        .passage-area {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 24px 24px 0;
        }

        .passage-text {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            font-size: 0.95rem;
            line-height: 1.85;
            color: var(--text-secondary);
            transition: opacity 300ms ease;
        }

        .passage-text.fading { opacity: 0; }

        .passage-text p {
            margin-bottom: 1.2em;
        }
        .passage-text p:last-child {
            margin-bottom: 0;
        }

        /* --- Hyperfocus Mode --- */
        .reader.hyperfocus .reader-header {
            opacity: 0;
            max-height: 0;
            padding: 0;
        }

        .reader.hyperfocus .post-passage {
            /* Simplify post-passage in hyperfocus: hide secondary/done, minimal primary */
        }
        .reader.hyperfocus .post-btn:not(.post-btn-primary),
        .reader.hyperfocus .save-line-btn,
        .reader.hyperfocus .thread-indicator,
        .reader.hyperfocus .context-note {
            display: none;
        }
        .reader.hyperfocus .post-btn-primary {
            border-color: var(--border);
        }
        .reader.hyperfocus .post-btn-primary .post-btn-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .reader.hyperfocus .post-btn-primary .post-btn-detail {
            display: none;
        }

        .hyperfocus-exit {
            position: fixed;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            display: none;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-muted);
            background: none;
            border: none;
            cursor: pointer;
            opacity: 0;
            transition: opacity 300ms;
            z-index: 10;
        }
        .hyperfocus-exit:hover { color: var(--text-secondary); }
        .reader.hyperfocus .hyperfocus-exit {
            display: flex;
            opacity: 0.3;
        }
        .reader.hyperfocus .hyperfocus-exit:hover {
            opacity: 1;
        }

        /* Reveal chrome on hover/tap at top */
        .reader.hyperfocus:hover .reader-header,
        .reader.hyperfocus.chrome-reveal .reader-header {
            opacity: 0.6;
            max-height: 50px;
            padding: 16px 24px 0;
        }

        /* --- Post-passage flow (appears after text) --- */
        .post-passage {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            padding: 48px 0 80px;
            display: none;
        }

        .post-passage.visible {
            display: block;
        }

        .post-divider {
            width: 40px;
            height: 1px;
            background: var(--border);
            margin: 0 auto 32px;
        }

        .post-btn {
            display: block;
            width: 100%;
            text-align: left;
            font-family: inherit;
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px 20px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: border-color 200ms, background 200ms;
        }
        .post-btn:hover {
            border-color: var(--border-hover);
            background: var(--bg-secondary);
        }

        .post-btn-primary {
            border-color: var(--accent-secondary);
        }
        .post-btn-primary:hover {
            background: rgba(34, 211, 238, 0.06);
            border-color: var(--accent-secondary);
        }

        .post-btn-label {
            font-size: 0.85rem;
            color: var(--accent-secondary);
            margin-bottom: 4px;
        }
        .post-btn:not(.post-btn-primary) .post-btn-label {
            color: var(--text-secondary);
        }

        .post-btn-detail {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .post-btn-done .post-btn-label {
            color: var(--text-muted);
        }

        /* --- Completion Card --- */
        .completion {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
            max-width: 480px;
            margin: 0 auto;
            text-align: center;
        }

        .completion-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .completion-actions {
            display: flex;
            gap: 16px;
        }

        .completion-btn {
            font-family: inherit;
            font-size: 0.8rem;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 150ms, color 150ms, border-color 150ms;
        }

        .completion-btn-save {
            color: var(--accent-secondary);
            background: none;
            border: 1px solid var(--accent-secondary);
        }
        .completion-btn-save:hover {
            background: var(--accent-secondary);
            color: var(--bg-primary);
        }

        .completion-btn-home {
            color: var(--text-muted);
            background: none;
            border: 1px solid var(--border);
        }
        .completion-btn-home:hover {
            border-color: var(--border-hover);
            color: var(--text-secondary);
        }

        /* --- Save a line (post-passage + completion) --- */
        .save-line-btn {
            display: block;
            width: 100%;
            text-align: left;
            font-family: inherit;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px 20px;
            margin-top: 6px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: border-color 200ms, color 200ms;
        }
        .save-line-btn:hover {
            border-color: var(--border-hover);
            color: var(--text-secondary);
        }
        .save-line-btn.saved {
            color: var(--text-muted);
            opacity: 0.5;
            pointer-events: none;
        }

        /* --- My Map view --- */
        .map-view {
            height: 100%;
            display: flex;
            flex-direction: column;
            max-width: 560px;
            margin: 0 auto;
            padding: 48px 24px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .map-heading {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .map-section-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 16px;
        }

        .map-bar-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            gap: 12px;
        }

        .map-bar-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            width: 80px;
            flex-shrink: 0;
            text-align: right;
        }

        .map-bar-track {
            flex: 1;
            height: 6px;
            background: var(--bg-tertiary);
            border-radius: 3px;
            overflow: hidden;
        }

        .map-bar-fill {
            height: 100%;
            background: var(--accent-secondary);
            border-radius: 3px;
            transition: width 400ms ease;
            opacity: 0.7;
        }

        .map-bar-count {
            font-size: 0.7rem;
            color: var(--text-muted);
            width: 70px;
            flex-shrink: 0;
        }

        .map-theme-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 8px;
            margin-bottom: 40px;
        }

        .map-theme-item {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .map-theme-count {
            color: var(--text-secondary);
        }

        .map-section {
            margin-bottom: 32px;
        }

        .map-back {
            font-family: inherit;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: none;
            border: none;
            cursor: pointer;
            margin-bottom: 24px;
            padding: 0;
        }
        .map-back:hover { color: var(--text-secondary); }

        /* --- My Anthology view --- */
        .anthology-view {
            height: 100%;
            display: flex;
            flex-direction: column;
            max-width: 600px;
            margin: 0 auto;
            padding: 48px 24px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .anthology-heading {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .anthology-empty {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.7;
        }

        .anthology-item {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: border-color 200ms, background 200ms;
        }
        .anthology-item:hover {
            border-color: var(--border-hover);
            background: var(--bg-secondary);
        }

        .anthology-item-title {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .anthology-item-line {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.7;
            font-style: italic;
        }

        .anthology-item-meta {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 8px;
            opacity: 0.6;
        }

        .anthology-back {
            font-family: inherit;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: none;
            border: none;
            cursor: pointer;
            margin-bottom: 24px;
            padding: 0;
        }
        .anthology-back:hover { color: var(--text-secondary); }

        /* --- Browse Mode --- */
        .browse-view {
            height: 100%;
            display: flex;
            flex-direction: column;
            max-width: 600px;
            margin: 0 auto;
            padding: 48px 24px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .browse-back {
            font-family: inherit;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: none;
            border: none;
            cursor: pointer;
            margin-bottom: 24px;
            padding: 0;
        }
        .browse-back:hover { color: var(--text-secondary); }

        .browse-heading {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .browse-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 28px;
        }

        .browse-filter-btn {
            font-family: inherit;
            font-size: 0.7rem;
            color: var(--text-muted);
            background: none;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 4px 12px;
            cursor: pointer;
            transition: border-color 200ms, color 200ms, background 200ms;
        }
        .browse-filter-btn:hover {
            border-color: var(--border-hover);
            color: var(--text-secondary);
        }
        .browse-filter-btn.active {
            border-color: var(--accent-secondary);
            color: var(--accent-secondary);
            background: rgba(34, 211, 238, 0.06);
        }

        .browse-group {
            margin-bottom: 32px;
        }

        .browse-group-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: capitalize;
        }

        .browse-card {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px 20px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: border-color 200ms, background 200ms;
        }
        .browse-card:hover {
            border-color: var(--border-hover);
            background: var(--bg-secondary);
        }
        .browse-card.read {
            opacity: 0.5;
        }

        .browse-card-title {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .browse-card-summary {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 6px;
        }

        .browse-card-tags {
            font-size: 0.65rem;
            color: var(--text-muted);
            opacity: 0.6;
        }

        .browse-show-more {
            font-family: inherit;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 0;
            transition: color 150ms;
        }
        .browse-show-more:hover { color: var(--text-secondary); }

        /* --- Context note (cross-passage reference) --- */
        .context-note {
            max-width: 700px;
            width: 100%;
            margin: 0 auto 16px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-style: italic;
            line-height: 1.6;
            border-left: 2px solid var(--border);
            padding: 8px 12px;
            cursor: pointer;
            transition: opacity 200ms;
        }
        .context-note.collapsed {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Thread indicator --- */
        .thread-indicator {
            font-size: 0.65rem;
            color: var(--text-muted);
            opacity: 0.5;
            text-align: center;
            padding: 4px 0 0;
        }

        /* --- Constellation Map --- */
        .constellation-canvas {
            width: 100%;
            height: 260px;
            margin-bottom: 24px;
            border-radius: 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
        }

        @media (max-width: 600px) {
            .passage-area { padding: 20px 16px 0; }
            .passage-text { font-size: 0.9rem; line-height: 1.8; }
            .reader-header { padding: 14px 16px 0; }
            .landing { padding: 0 16px; }
            .featured-card { padding: 24px 20px; }
            .completion { padding: 0 16px; }
            .map-view { padding: 40px 16px; }
            .anthology-view { padding: 40px 16px; }
            .browse-view { padding: 40px 16px; }
            .map-bar-label { width: 64px; font-size: 0.7rem; }
        }

        @media (max-width: 400px) {
            .passage-text { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">loading...</div>

    <div class="landing" id="landing" style="display:none">
        <div class="resume-strip" id="resume-strip" style="display:none">
            <span class="resume-strip-text" id="resume-strip-text"></span>
            <button class="resume-strip-btn" id="resume-btn">Resume</button>
        </div>
        <div class="featured-card" id="featured-card">
            <div class="featured-title" id="featured-title"></div>
            <div class="featured-summary" id="featured-summary"></div>
            <div class="featured-tags" id="featured-tags"></div>
            <button class="featured-cta">Read this</button>
        </div>
        <div class="landing-secondary">
            <button class="landing-link" id="another-btn">Another one</button>
            <button class="landing-link" id="browse-btn">pick your own &rarr;</button>
            <button class="landing-link" id="map-btn">my map</button>
            <button class="landing-link" id="anthology-btn">my anthology</button>
        </div>
    </div>

    <div class="reader" id="reader" style="display:none">
        <button class="hyperfocus-exit" id="hyperfocus-exit" title="Exit focus mode">&times;</button>
        <div class="reader-header" id="reader-header"></div>
        <div class="thread-indicator" id="thread-indicator" style="display:none"></div>
        <div class="passage-area" id="passage-area">
            <div class="context-note collapsed" id="context-note" style="display:none"></div>
            <div class="passage-text" id="passage-text"></div>
            <div class="post-passage" id="post-passage">
                <div class="post-divider"></div>
                <button class="post-btn post-btn-primary" id="post-primary">
                    <div class="post-btn-label" id="post-primary-label"></div>
                    <div class="post-btn-detail" id="post-primary-detail"></div>
                </button>
                <button class="post-btn" id="post-secondary">
                    <div class="post-btn-label" id="post-secondary-label">Different vibe</div>
                    <div class="post-btn-detail" id="post-secondary-detail"></div>
                </button>
                <button class="post-btn post-btn-done" id="post-done">
                    <div class="post-btn-label">Done for now</div>
                </button>
                <button class="save-line-btn" id="post-save-line">Save this passage</button>
            </div>
        </div>
    </div>

    <div class="completion" id="completion" style="display:none">
        <div class="completion-text" id="completion-text"></div>
        <div class="completion-actions">
            <button class="completion-btn completion-btn-save" id="completion-save">Save a line</button>
            <button class="completion-btn completion-btn-home" id="completion-home">Home</button>
        </div>
    </div>

    <div class="map-view" id="map-view" style="display:none">
        <button class="map-back" id="map-back">&larr; back</button>
        <div class="map-heading">Where you've been</div>
        <canvas class="constellation-canvas" id="constellation-canvas"></canvas>
        <div class="map-section">
            <div class="map-section-label">By topic</div>
            <div id="map-bars"></div>
        </div>
        <div class="map-section">
            <div class="map-section-label">By theme</div>
            <div class="map-theme-row" id="map-themes"></div>
        </div>
    </div>

    <div class="anthology-view" id="anthology-view" style="display:none">
        <button class="anthology-back" id="anthology-back">&larr; back</button>
        <div class="anthology-heading">Passages that stuck</div>
        <div id="anthology-list"></div>
    </div>

    <div class="browse-view" id="browse-view" style="display:none">
        <button class="browse-back" id="browse-back">&larr; back</button>
        <div class="browse-heading">Pick your own</div>
        <div class="browse-filters" id="browse-filters"></div>
        <div id="browse-groups"></div>
    </div>

    <script>
    (function () {
        const params = new URLSearchParams(location.search);
        const slug = params.get('book');
        if (!slug) { location.href = '/library/'; return; }

        const KEY_POS = `library-${slug}-pos`;
        const KEY_BM = `library-${slug}-bookmarks`;
        const KEY_HISTORY = `library-${slug}-history`;
        const KEY_LAST_OPEN = `library-${slug}-lastOpen`;
        const KEY_SAVED = `library-${slug}-saved`;
        let passages = [];
        let meta = {};
        let pos = 0;
        let featuredPassage = null;
        let currentRec = null;    // recommended next passage
        let currentAlt = null;    // "different vibe" passage
        let sessionPassages = []; // passages read this session
        let sessionTimestamps = []; // timestamps of each passage entry this session
        let hyperfocusActive = false;

        const HYPERFOCUS_GAP_MS = 90000; // 90 seconds max gap between reads
        const HYPERFOCUS_MIN_STREAK = 3;

        // Theme classification for the Story→Science→Meaning loop
        // narrative, personal, history → "story-like"
        // science → "science"
        // philosophy → "meaning"
        function themeClass(theme) {
            if (theme === 'science') return 'science';
            if (theme === 'philosophy') return 'meaning';
            return 'story'; // narrative, personal, history
        }

        function nextThemeClass(tc) {
            if (tc === 'story') return 'science';
            if (tc === 'science') return 'meaning';
            return 'story'; // meaning → story
        }

        function themeClassToThemes(tc) {
            if (tc === 'science') return ['science'];
            if (tc === 'meaning') return ['philosophy'];
            return ['narrative', 'personal', 'history'];
        }

        // Contextual label for the primary recommendation
        function primaryLabel(currentTheme) {
            const tc = themeClass(currentTheme);
            if (tc === 'story') return 'The science behind this \u2192';
            if (tc === 'science') return 'What this means \u2192';
            return 'Another story \u2192';
        }

        // --- Read History ---
        function getHistory() {
            try { return JSON.parse(localStorage.getItem(KEY_HISTORY) || '[]'); } catch { return []; }
        }
        function addToHistory(id) {
            const h = getHistory();
            h.push({ id, ts: Date.now() });
            localStorage.setItem(KEY_HISTORY, JSON.stringify(h));
        }
        function getReadIds() {
            return new Set(getHistory().map(e => e.id));
        }

        // --- Bookmarks ---
        function getBookmarks() {
            try { return JSON.parse(localStorage.getItem(KEY_BM) || '{}'); } catch { return {}; }
        }
        function setBookmarks(bm) { localStorage.setItem(KEY_BM, JSON.stringify(bm)); }
        function toggleBookmark(id) {
            const bm = getBookmarks();
            if (bm[id]) delete bm[id]; else bm[id] = true;
            setBookmarks(bm);
        }

        // --- Saved Passages (Anthology) ---
        function getSavedPassages() {
            try { return JSON.parse(localStorage.getItem(KEY_SAVED) || '[]'); } catch { return []; }
        }
        function setSavedPassages(sp) { localStorage.setItem(KEY_SAVED, JSON.stringify(sp)); }
        function savePassage(passageId, savedLine) {
            const sp = getSavedPassages();
            if (sp.some(e => e.passageId === passageId)) return false; // already saved
            sp.push({ passageId, savedLine: savedLine || null, ts: Date.now() });
            setSavedPassages(sp);
            return true;
        }
        function isPassageSaved(passageId) {
            return getSavedPassages().some(e => e.passageId === passageId);
        }

        // --- Migrate bookmarks → savedPassages ---
        function migrateBookmarks() {
            const bm = getBookmarks();
            const ids = Object.keys(bm).filter(k => bm[k]);
            if (ids.length === 0) return;
            const sp = getSavedPassages();
            const existingIds = new Set(sp.map(e => e.passageId));
            let migrated = false;
            ids.forEach(idStr => {
                const id = parseInt(idStr, 10);
                if (!existingIds.has(id)) {
                    sp.push({ passageId: id, savedLine: null, ts: Date.now() });
                    migrated = true;
                }
            });
            if (migrated) {
                setSavedPassages(sp);
            }
            // Clear old bookmarks
            localStorage.removeItem(KEY_BM);
        }

        // --- Featured Passage Algorithm ---
        function pickFeatured() {
            const history = getHistory();
            const readIds = getReadIds();
            const lastOpen = parseInt(localStorage.getItem(KEY_LAST_OPEN) || '0', 10);
            const daysSinceOpen = lastOpen ? (Date.now() - lastOpen) / (1000 * 60 * 60 * 24) : 999;

            if (history.length === 0) return passages[0];

            const unread = passages.filter(p => !readIds.has(p.id));
            if (unread.length === 0) {
                return passages[Math.floor(Math.random() * passages.length)];
            }

            if (daysSinceOpen > 7) {
                const systemCounts = {};
                history.forEach(e => {
                    const p = passages.find(pp => pp.id === e.id);
                    if (p) systemCounts[p.body_system] = (systemCounts[p.body_system] || 0) + 1;
                });
                const unreadSystems = [...new Set(unread.map(p => p.body_system))];
                unreadSystems.sort((a, b) => (systemCounts[a] || 0) - (systemCounts[b] || 0));
                const targetSystem = unreadSystems[0];
                const candidates = unread.filter(p => p.body_system === targetSystem && p.theme === 'narrative');
                if (candidates.length > 0) return candidates[Math.floor(Math.random() * candidates.length)];
                const fallback = unread.filter(p => p.body_system === targetSystem);
                return fallback[Math.floor(Math.random() * fallback.length)];
            }

            const systemCounts = {};
            const themeCounts = {};
            history.forEach(e => {
                const p = passages.find(pp => pp.id === e.id);
                if (p) {
                    systemCounts[p.body_system] = (systemCounts[p.body_system] || 0) + 1;
                    themeCounts[p.theme] = (themeCounts[p.theme] || 0) + 1;
                }
            });

            const scored = unread.map(p => {
                let score = 1;
                score += (systemCounts[p.body_system] || 0) * 2;
                score += (themeCounts[p.theme] || 0);
                if (p.theme === 'narrative') score += 3;
                const recentIds = history.slice(-5).map(e => e.id);
                const recentChapters = recentIds.map(id => {
                    const rp = passages.find(pp => pp.id === id);
                    return rp ? rp.chapter : null;
                });
                if (recentChapters.includes(p.chapter)) score *= 0.3;
                return { passage: p, score };
            });

            const totalScore = scored.reduce((s, e) => s + e.score, 0);
            let r = Math.random() * totalScore;
            for (const entry of scored) {
                r -= entry.score;
                if (r <= 0) return entry.passage;
            }
            return scored[scored.length - 1].passage;
        }

        // --- Story→Science→Meaning recommendation engine ---
        function pickRecommended(current) {
            const readIds = getReadIds();
            const sessionIds = new Set(sessionPassages.map(p => p.id));
            const wantClass = nextThemeClass(themeClass(current.theme));
            const wantThemes = themeClassToThemes(wantClass);

            // Exclude current + already read this session
            function isCandidate(p) {
                return p.id !== current.id && !sessionIds.has(p.id);
            }

            // Priority 0: same thread_id (explicit thread continuation)
            if (current.thread_id) {
                let threadCandidates = passages.filter(p =>
                    isCandidate(p) && p.thread_id === current.thread_id);
                if (threadCandidates.length > 0) return pickWeighted(threadCandidates, readIds);
            }

            // Priority 1: same chapter, complementary theme
            let candidates = passages.filter(p =>
                isCandidate(p) && p.chapter === current.chapter && wantThemes.includes(p.theme));
            if (candidates.length > 0) return pickWeighted(candidates, readIds);

            // Priority 2: same body_system, complementary theme
            candidates = passages.filter(p =>
                isCandidate(p) && p.body_system === current.body_system && wantThemes.includes(p.theme));
            if (candidates.length > 0) return pickWeighted(candidates, readIds);

            // Priority 3: different body_system, narrative (fresh hook)
            if (wantClass === 'story') {
                candidates = passages.filter(p =>
                    isCandidate(p) && p.body_system !== current.body_system && themeClass(p.theme) === 'story');
                if (candidates.length > 0) return pickWeighted(candidates, readIds);
            }

            // Priority 4: any complementary theme
            candidates = passages.filter(p =>
                isCandidate(p) && wantThemes.includes(p.theme));
            if (candidates.length > 0) return pickWeighted(candidates, readIds);

            // Fallback: any unread narrative
            candidates = passages.filter(p =>
                isCandidate(p) && !readIds.has(p.id) && themeClass(p.theme) === 'story');
            if (candidates.length > 0) return candidates[Math.floor(Math.random() * candidates.length)];

            // Last resort: any passage not current
            candidates = passages.filter(p => isCandidate(p));
            if (candidates.length > 0) return candidates[Math.floor(Math.random() * candidates.length)];

            return null;
        }

        // Prefer unread, weighted random
        function pickWeighted(candidates, readIds) {
            const scored = candidates.map(p => ({
                passage: p,
                score: readIds.has(p.id) ? 0.2 : 1
            }));
            const total = scored.reduce((s, e) => s + e.score, 0);
            let r = Math.random() * total;
            for (const e of scored) {
                r -= e.score;
                if (r <= 0) return e.passage;
            }
            return scored[scored.length - 1].passage;
        }

        // "Different vibe" — contrasting theme AND/OR body_system
        function pickDifferentVibe(current) {
            const readIds = getReadIds();
            const sessionIds = new Set(sessionPassages.map(p => p.id));
            const curClass = themeClass(current.theme);

            function isCandidate(p) {
                return p.id !== current.id && !sessionIds.has(p.id);
            }

            // Different body_system AND different theme class
            let candidates = passages.filter(p =>
                isCandidate(p) && p.body_system !== current.body_system && themeClass(p.theme) !== curClass);
            if (candidates.length > 0) return pickWeighted(candidates, readIds);

            // Different body_system OR different theme class
            candidates = passages.filter(p =>
                isCandidate(p) && (p.body_system !== current.body_system || themeClass(p.theme) !== curClass));
            if (candidates.length > 0) return pickWeighted(candidates, readIds);

            // Anything else
            candidates = passages.filter(p => isCandidate(p));
            if (candidates.length > 0) return pickWeighted(candidates, readIds);

            return null;
        }

        // --- Estimate read time ---
        function estimateMinutes(passage) {
            const words = passage.content.split(/\s+/).length;
            return Math.max(1, Math.round(words / 200));
        }

        // --- Hyperfocus detection ---
        function checkHyperfocus() {
            if (sessionTimestamps.length < HYPERFOCUS_MIN_STREAK) {
                setHyperfocus(false);
                return;
            }
            // Check last N reads had short gaps
            let streak = 1;
            for (let i = sessionTimestamps.length - 1; i > 0; i--) {
                const gap = sessionTimestamps[i] - sessionTimestamps[i - 1];
                if (gap <= HYPERFOCUS_GAP_MS) {
                    streak++;
                } else {
                    break;
                }
            }
            setHyperfocus(streak >= HYPERFOCUS_MIN_STREAK);
        }

        function setHyperfocus(on) {
            hyperfocusActive = on;
            const readerEl = document.getElementById('reader');
            if (on) {
                readerEl.classList.add('hyperfocus');
            } else {
                readerEl.classList.remove('hyperfocus');
            }
        }

        // --- Crossfade transition ---
        function crossfadeTo(renderFn) {
            const textEl = document.getElementById('passage-text');
            textEl.classList.add('fading');
            setTimeout(() => {
                renderFn();
                textEl.classList.remove('fading');
            }, 300);
        }

        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // --- Show/hide views ---
        function hideAll() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('landing').style.display = 'none';
            document.getElementById('reader').style.display = 'none';
            document.getElementById('completion').style.display = 'none';
            document.getElementById('map-view').style.display = 'none';
            document.getElementById('anthology-view').style.display = 'none';
            document.getElementById('browse-view').style.display = 'none';
        }

        // --- Show Landing ---
        function showLanding() {
            featuredPassage = pickFeatured();
            const p = featuredPassage;

            document.getElementById('featured-title').textContent = p.title;
            document.getElementById('featured-summary').textContent = p.summary;
            document.getElementById('featured-tags').textContent =
                `${p.body_system} \xb7 ${p.theme} \xb7 ~${estimateMinutes(p)} min`;

            const savedPosVal = localStorage.getItem(KEY_POS);
            const history = getHistory();
            if (history.length > 0 && savedPosVal !== null) {
                const resumeP = passages[parseInt(savedPosVal, 10)];
                if (resumeP && resumeP.id !== p.id) {
                    document.getElementById('resume-strip-text').textContent =
                        `You were reading: \u201c${resumeP.title}\u201d`;
                    document.getElementById('resume-strip').style.display = 'flex';
                }
            }

            hideAll();
            document.getElementById('landing').style.display = 'flex';
        }

        // --- Enter Reader ---
        function enterReader(passageId) {
            const idx = passages.findIndex(p => p.id === passageId);
            if (idx >= 0) pos = idx;

            hideAll();
            document.getElementById('reader').style.display = 'flex';
            addToHistory(passageId);
            sessionPassages.push(passages[pos]);
            sessionTimestamps.push(Date.now());
            checkHyperfocus();
            renderPassage();
        }

        // --- Render passage ---
        function renderPassage() {
            const p = passages[pos];
            if (!p) return;

            // Minimal header: body_system · theme · chapter
            document.getElementById('reader-header').textContent =
                `${p.body_system} \xb7 ${p.theme} \xb7 ${p.chapter}`;

            // Passage text
            const textEl = document.getElementById('passage-text');
            const html = p.content.split('\n').filter(s => s.trim())
                .map(para => `<p>${escapeHtml(para)}</p>`).join('');
            textEl.innerHTML = html;

            // Compute recommendations
            currentRec = pickRecommended(p);
            currentAlt = pickDifferentVibe(p);

            // Post-passage buttons
            const postEl = document.getElementById('post-passage');
            postEl.classList.add('visible');

            // Primary — contextual recommendation
            document.getElementById('post-primary-label').textContent = primaryLabel(p.theme);
            if (currentRec) {
                document.getElementById('post-primary-detail').textContent =
                    `${currentRec.title} \xb7 ~${estimateMinutes(currentRec)} min`;
            } else {
                document.getElementById('post-primary-detail').textContent = '';
            }

            // Secondary — different vibe
            if (currentAlt) {
                document.getElementById('post-secondary-detail').textContent =
                    `${currentAlt.body_system} \xb7 ${currentAlt.theme}`;
            } else {
                document.getElementById('post-secondary-detail').textContent = '';
            }

            // Update save button state
            updateSaveBtn(document.getElementById('post-save-line'), p.id);

            // Context note
            renderContextNote(p);

            // Thread indicator
            renderThreadIndicator(p);

            // Reset auto-advance flag and scroll to top
            autoAdvanceTriggered = false;
            document.getElementById('passage-area').scrollTop = 0;

            // Save position
            localStorage.setItem(KEY_POS, pos);
        }

        // --- Show Completion Card ---
        function showCompletion() {
            const p = passages[pos];
            const lines = [
                `You read about ${p.body_system === 'general' ? 'life and death' : 'the ' + p.body_system}. That counts.`,
            ];
            if (sessionPassages.length > 1) {
                lines[0] = `You read ${sessionPassages.length} passages. That counts.`;
            }

            document.getElementById('completion-text').textContent = lines[0];

            // Reset save button state
            const saveBtn = document.getElementById('completion-save');
            if (isPassageSaved(p.id)) {
                saveBtn.textContent = 'Saved';
                saveBtn.style.opacity = '0.5';
                saveBtn.style.pointerEvents = 'none';
            } else {
                saveBtn.textContent = 'Save a line';
                saveBtn.style.opacity = '1';
                saveBtn.style.pointerEvents = 'auto';
            }

            hideAll();
            document.getElementById('completion').style.display = 'flex';
        }

        // --- Show Map ---
        function showMap() {
            const history = getHistory();
            const readIds = getReadIds();

            // Count by body_system
            const systemCounts = {};
            const themeCounts = {};
            history.forEach(e => {
                const p = passages.find(pp => pp.id === e.id);
                if (p) {
                    systemCounts[p.body_system] = (systemCounts[p.body_system] || 0);
                    themeCounts[p.theme] = (themeCounts[p.theme] || 0);
                }
            });
            // Use unique read passages (not repeat visits)
            readIds.forEach(id => {
                const p = passages.find(pp => pp.id === id);
                if (p) {
                    systemCounts[p.body_system] = (systemCounts[p.body_system] || 0) + 1;
                    themeCounts[p.theme] = (themeCounts[p.theme] || 0) + 1;
                }
            });

            const barsEl = document.getElementById('map-bars');
            const systems = Object.entries(systemCounts).sort((a, b) => b[1] - a[1]);
            const maxCount = systems.length > 0 ? systems[0][1] : 1;

            barsEl.innerHTML = systems.map(([sys, count]) => {
                const pct = Math.round((count / maxCount) * 100);
                const label = count === 1 ? '1 passage' : `${count} passages`;
                return `<div class="map-bar-row">
                    <div class="map-bar-label">${escapeHtml(sys)}</div>
                    <div class="map-bar-track"><div class="map-bar-fill" style="width:${pct}%"></div></div>
                    <div class="map-bar-count">${label}</div>
                </div>`;
            }).join('');

            const themesEl = document.getElementById('map-themes');
            const themes = Object.entries(themeCounts).sort((a, b) => b[1] - a[1]);
            themesEl.innerHTML = themes.map(([theme, count]) =>
                `<span class="map-theme-item">${escapeHtml(theme)}: <span class="map-theme-count">${count}</span></span>`
            ).join('');

            if (systems.length === 0) {
                barsEl.innerHTML = '<div style="font-size:0.8rem;color:var(--text-muted)">Nothing here yet. Read a passage to start your map.</div>';
                themesEl.innerHTML = '';
            }

            hideAll();
            document.getElementById('map-view').style.display = 'flex';
            // Render constellation after display so canvas has dimensions
            requestAnimationFrame(() => renderConstellation());
        }

        // --- Show Anthology ---
        function showAnthology() {
            const saved = getSavedPassages();
            const listEl = document.getElementById('anthology-list');

            if (saved.length === 0) {
                listEl.innerHTML = '<div class="anthology-empty">Nothing saved yet. After reading a passage, tap "Save this passage" to add it here.</div>';
            } else {
                // Show newest first
                const items = [...saved].reverse();
                listEl.innerHTML = items.map(entry => {
                    const p = passages.find(pp => pp.id === entry.passageId);
                    if (!p) return '';
                    const line = entry.savedLine
                        ? `<div class="anthology-item-line">"${escapeHtml(entry.savedLine)}"</div>`
                        : `<div class="anthology-item-line">${escapeHtml(p.summary)}</div>`;
                    const date = new Date(entry.ts);
                    const dateStr = date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
                    return `<div class="anthology-item" data-passage-id="${p.id}">
                        <div class="anthology-item-title">${escapeHtml(p.title)}</div>
                        ${line}
                        <div class="anthology-item-meta">${escapeHtml(p.body_system)} · ${escapeHtml(p.theme)} · saved ${dateStr}</div>
                    </div>`;
                }).join('');

                // Click to read
                listEl.querySelectorAll('.anthology-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const id = parseInt(el.dataset.passageId, 10);
                        enterReader(id);
                    });
                });
            }

            hideAll();
            document.getElementById('anthology-view').style.display = 'flex';
        }

        // --- Update save button state ---
        function updateSaveBtn(btnEl, passageId) {
            if (isPassageSaved(passageId)) {
                btnEl.textContent = 'Saved';
                btnEl.classList.add('saved');
            } else {
                btnEl.textContent = 'Save this passage';
                btnEl.classList.remove('saved');
            }
        }

        // --- Load ---
        fetch(`${slug}/passages.json`)
            .then(r => r.json())
            .then(data => {
                meta = data.meta;
                passages = data.passages;
                document.title = `${meta.title} | spiffler.xyz`;

                const saved = localStorage.getItem(KEY_POS);
                pos = saved ? Math.min(parseInt(saved, 10), passages.length - 1) : 0;

                // Migrate: seed history from existing position if needed
                const history = getHistory();
                if (history.length === 0 && saved !== null && parseInt(saved, 10) > 0) {
                    for (let i = 0; i <= Math.min(parseInt(saved, 10), passages.length - 1); i++) {
                        addToHistory(passages[i].id);
                    }
                }

                // Migrate bookmarks → saved passages
                migrateBookmarks();

                showLanding();
                localStorage.setItem(KEY_LAST_OPEN, Date.now().toString());
            })
            .catch(() => {
                document.getElementById('loading').textContent = 'book not found';
            });

        // --- Landing events ---
        document.getElementById('featured-card').addEventListener('click', () => {
            if (featuredPassage) enterReader(featuredPassage.id);
        });

        document.getElementById('another-btn').addEventListener('click', () => {
            featuredPassage = pickFeatured();
            const p = featuredPassage;
            document.getElementById('featured-title').textContent = p.title;
            document.getElementById('featured-summary').textContent = p.summary;
            document.getElementById('featured-tags').textContent =
                `${p.body_system} \xb7 ${p.theme} \xb7 ~${estimateMinutes(p)} min`;
        });

        document.getElementById('resume-btn').addEventListener('click', () => {
            const savedPosVal = localStorage.getItem(KEY_POS);
            if (savedPosVal !== null) {
                const resumeP = passages[parseInt(savedPosVal, 10)];
                if (resumeP) enterReader(resumeP.id);
            }
        });

        document.getElementById('browse-btn').addEventListener('click', () => {
            showBrowse();
        });

        document.getElementById('map-btn').addEventListener('click', () => {
            showMap();
        });

        document.getElementById('anthology-btn').addEventListener('click', () => {
            showAnthology();
        });

        document.getElementById('map-back').addEventListener('click', () => {
            showLanding();
        });

        document.getElementById('anthology-back').addEventListener('click', () => {
            showLanding();
        });

        // --- Browse Mode ---
        const BROWSE_PAGE_SIZE = 6;
        let browseExpanded = {}; // body_system → true if "show more" clicked
        let browseThemeFilter = null; // null = all, or a theme string

        function showBrowse() {
            browseExpanded = {};
            browseThemeFilter = null;
            renderBrowse();
            hideAll();
            document.getElementById('browse-view').style.display = 'flex';
        }

        function renderBrowse() {
            const readIds = getReadIds();

            // Collect all unique themes for filter chips
            const allThemes = [...new Set(passages.map(p => p.theme))].sort();

            const filtersEl = document.getElementById('browse-filters');
            filtersEl.innerHTML = `<button class="browse-filter-btn ${browseThemeFilter === null ? 'active' : ''}" data-theme="">all</button>` +
                allThemes.map(t =>
                    `<button class="browse-filter-btn ${browseThemeFilter === t ? 'active' : ''}" data-theme="${escapeHtml(t)}">${escapeHtml(t)}</button>`
                ).join('');

            filtersEl.querySelectorAll('.browse-filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const t = btn.dataset.theme;
                    browseThemeFilter = t === '' ? null : t;
                    browseExpanded = {};
                    renderBrowse();
                });
            });

            // Group passages by body_system
            const groups = {};
            passages.forEach(p => {
                if (browseThemeFilter && p.theme !== browseThemeFilter) return;
                if (!groups[p.body_system]) groups[p.body_system] = [];
                groups[p.body_system].push(p);
            });

            // Sort groups by number of passages (largest first)
            const sortedSystems = Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length);

            const groupsEl = document.getElementById('browse-groups');
            groupsEl.innerHTML = sortedSystems.map(sys => {
                const all = groups[sys];
                const expanded = browseExpanded[sys];
                const visible = expanded ? all : all.slice(0, BROWSE_PAGE_SIZE);
                const hasMore = all.length > BROWSE_PAGE_SIZE && !expanded;

                const cards = visible.map(p => {
                    const readClass = readIds.has(p.id) ? ' read' : '';
                    return `<div class="browse-card${readClass}" data-passage-id="${p.id}">
                        <div class="browse-card-title">${escapeHtml(p.title)}</div>
                        <div class="browse-card-summary">${escapeHtml(p.summary)}</div>
                        <div class="browse-card-tags">${escapeHtml(p.body_system)} · ${escapeHtml(p.theme)} · ~${estimateMinutes(p)} min</div>
                    </div>`;
                }).join('');

                const showMoreBtn = hasMore
                    ? `<button class="browse-show-more" data-system="${escapeHtml(sys)}">show more (${all.length - BROWSE_PAGE_SIZE})</button>`
                    : '';

                return `<div class="browse-group">
                    <div class="browse-group-label">${escapeHtml(sys)}</div>
                    ${cards}
                    ${showMoreBtn}
                </div>`;
            }).join('');

            if (sortedSystems.length === 0) {
                groupsEl.innerHTML = '<div style="font-size:0.8rem;color:var(--text-muted)">No passages match this filter.</div>';
            }

            // Card click → enter reader
            groupsEl.querySelectorAll('.browse-card').forEach(el => {
                el.addEventListener('click', () => {
                    const id = parseInt(el.dataset.passageId, 10);
                    enterReader(id);
                });
            });

            // Show more click
            groupsEl.querySelectorAll('.browse-show-more').forEach(btn => {
                btn.addEventListener('click', () => {
                    browseExpanded[btn.dataset.system] = true;
                    renderBrowse();
                });
            });
        }

        document.getElementById('browse-back').addEventListener('click', () => {
            showLanding();
        });

        // --- Post-passage events ---
        function advanceToPassage(passage) {
            const idx = passages.findIndex(p => p.id === passage.id);
            if (idx < 0) return;
            pos = idx;
            addToHistory(passage.id);
            sessionPassages.push(passage);
            sessionTimestamps.push(Date.now());
            checkHyperfocus();
            crossfadeTo(() => renderPassage());
        }

        document.getElementById('post-primary').addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentRec) advanceToPassage(currentRec);
        });

        document.getElementById('post-secondary').addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentAlt) advanceToPassage(currentAlt);
        });

        document.getElementById('post-done').addEventListener('click', (e) => {
            e.stopPropagation();
            showCompletion();
        });

        // --- Post-passage save ---
        document.getElementById('post-save-line').addEventListener('click', (e) => {
            e.stopPropagation();
            const p = passages[pos];
            if (p) {
                savePassage(p.id, null);
                updateSaveBtn(document.getElementById('post-save-line'), p.id);
            }
        });

        // --- Completion events ---
        document.getElementById('completion-save').addEventListener('click', () => {
            const p = passages[pos];
            if (p) {
                savePassage(p.id, null);
                document.getElementById('completion-save').textContent = 'Saved';
                document.getElementById('completion-save').style.opacity = '0.5';
                document.getElementById('completion-save').style.pointerEvents = 'none';
            }
        });

        document.getElementById('completion-home').addEventListener('click', () => {
            sessionPassages = [];
            sessionTimestamps = [];
            setHyperfocus(false);
            showLanding();
        });

        // --- Hyperfocus exit ---
        document.getElementById('hyperfocus-exit').addEventListener('click', () => {
            setHyperfocus(false);
            // Reset streak so it won't immediately re-trigger
            sessionTimestamps = [Date.now()];
        });

        // --- Auto-advance: in hyperfocus, scrolling past post-passage loads next ---
        let autoAdvanceTriggered = false;
        document.getElementById('passage-area').addEventListener('scroll', () => {
            if (!hyperfocusActive || !currentRec || autoAdvanceTriggered) return;
            const area = document.getElementById('passage-area');
            const scrollBottom = area.scrollTop + area.clientHeight;
            const scrollMax = area.scrollHeight;
            // Trigger when within 40px of bottom
            if (scrollMax - scrollBottom < 40) {
                autoAdvanceTriggered = true;
                advanceToPassage(currentRec);
            }
        });

        // --- Context Note / Context Refs ---
        function renderContextNote(passage) {
            const noteEl = document.getElementById('context-note');
            if (passage.context_note) {
                noteEl.textContent = passage.context_note;
                noteEl.style.display = 'block';
                noteEl.classList.add('collapsed');
            } else if (passage.context_refs && passage.context_refs.length > 0) {
                // Build a brief note from referenced passages
                const refs = passage.context_refs.map(refId => {
                    const rp = passages.find(p => p.id === refId);
                    return rp ? rp.title : null;
                }).filter(Boolean);
                if (refs.length > 0) {
                    noteEl.textContent = 'Related: ' + refs.join(', ');
                    noteEl.style.display = 'block';
                    noteEl.classList.add('collapsed');
                } else {
                    noteEl.style.display = 'none';
                }
            } else {
                noteEl.style.display = 'none';
            }
        }

        document.getElementById('context-note').addEventListener('click', () => {
            document.getElementById('context-note').classList.toggle('collapsed');
        });

        // --- Thread Indicator ---
        function renderThreadIndicator(passage) {
            const el = document.getElementById('thread-indicator');
            if (passage.thread_id) {
                // Find thread label: use thread_id as label, capitalize
                const label = passage.thread_id.replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                el.textContent = label + ' thread';
                el.style.display = 'block';
            } else {
                // Implicit thread: if continuing same body_system as previous passage
                if (sessionPassages.length >= 2) {
                    const prev = sessionPassages[sessionPassages.length - 2];
                    if (prev.body_system === passage.body_system) {
                        const sysLabel = passage.body_system.charAt(0).toUpperCase() + passage.body_system.slice(1);
                        el.textContent = sysLabel + ' thread';
                        el.style.display = 'block';
                        return;
                    }
                }
                el.style.display = 'none';
            }
        }

        // --- Constellation Visualization ---
        function renderConstellation() {
            const canvas = document.getElementById('constellation-canvas');
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            const W = rect.width;
            const H = rect.height;

            ctx.clearRect(0, 0, W, H);

            const readIds = getReadIds();
            if (readIds.size === 0) {
                ctx.fillStyle = '#64748b';
                ctx.font = '12px JetBrains Mono, monospace';
                ctx.textAlign = 'center';
                ctx.fillText('Read passages to grow your constellation', W / 2, H / 2);
                return;
            }

            // Cluster positions by body_system
            const systems = [...new Set(passages.map(p => p.body_system))];
            const systemPositions = {};
            const padding = 40;
            const usableW = W - padding * 2;
            const usableH = H - padding * 2;

            // Arrange systems in a loose grid
            const cols = Math.ceil(Math.sqrt(systems.length));
            const rows = Math.ceil(systems.length / cols);
            systems.forEach((sys, i) => {
                const col = i % cols;
                const row = Math.floor(i / cols);
                systemPositions[sys] = {
                    cx: padding + (usableW / (cols)) * (col + 0.5),
                    cy: padding + (usableH / (rows)) * (row + 0.5)
                };
            });

            // Assign each passage a position with jitter around its system center
            const passagePos = {};
            const systemCounters = {};
            passages.forEach(p => {
                if (!systemCounters[p.body_system]) systemCounters[p.body_system] = 0;
                const idx = systemCounters[p.body_system]++;
                const center = systemPositions[p.body_system];
                // Spiral outward
                const angle = idx * 2.4; // golden angle-ish
                const r = 8 + Math.sqrt(idx) * 7;
                passagePos[p.id] = {
                    x: center.cx + Math.cos(angle) * Math.min(r, usableW / (cols * 2) - 10),
                    y: center.cy + Math.sin(angle) * Math.min(r, usableH / (rows * 2) - 10)
                };
            });

            // Draw connections between consecutively read passages
            const history = getHistory();
            ctx.strokeStyle = 'rgba(34, 211, 238, 0.08)';
            ctx.lineWidth = 1;
            for (let i = 1; i < history.length; i++) {
                const a = passagePos[history[i - 1].id];
                const b = passagePos[history[i].id];
                if (a && b) {
                    ctx.beginPath();
                    ctx.moveTo(a.x, a.y);
                    ctx.lineTo(b.x, b.y);
                    ctx.stroke();
                }
            }

            // Draw system labels
            ctx.font = '10px JetBrains Mono, monospace';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#64748b';
            systems.forEach(sys => {
                const center = systemPositions[sys];
                ctx.fillText(sys, center.cx, center.cy - (usableH / (rows * 2)) + 5);
            });

            // Draw dots
            passages.forEach(p => {
                const pt = passagePos[p.id];
                const isRead = readIds.has(p.id);
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, isRead ? 3 : 1.5, 0, Math.PI * 2);
                if (isRead) {
                    ctx.fillStyle = 'rgba(34, 211, 238, 0.6)';
                } else {
                    ctx.fillStyle = 'rgba(100, 116, 139, 0.2)';
                }
                ctx.fill();
            });
        }

        // --- Keyboard (reader only) ---
        document.addEventListener('keydown', e => {
            if (document.getElementById('reader').style.display === 'none') return;
            if (e.key === 'Escape') {
                if (hyperfocusActive) {
                    // First ESC reveals chrome temporarily
                    const readerEl = document.getElementById('reader');
                    readerEl.classList.add('chrome-reveal');
                    setTimeout(() => readerEl.classList.remove('chrome-reveal'), 3000);
                } else {
                    showCompletion();
                }
            }
        });
    })();
    </script>
</body>
</html>
