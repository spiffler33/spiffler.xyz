<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="200" height="230" role="img" aria-label="PIP, a small floating maintenance robot">
  <!-- PIP. Flat vector, rounded friendly geometry, 2-3 tone shading; gradients only for glows.
       Colours are hex equivalents of the OKLCH palette (SVG presentation attributes stay hex
       so no renderer has to worry about colour-space support; CSS chrome uses oklch()).

       ADDRESSABLE PARTS — the renderer and later phases drive these by id:
         #pip-float          the whole robot; the bob / talk / celebrate animations transform this
         #pip-eye-l #pip-eye-r   squash for blinks and for the celebrate squint
         #pip-mouth          swapped path for talk / celebrate
         #pip-core-crack     the cracked memory core (P6 fades this out on restore)
         #pip-nameplate-text the engraved name — P6 sets it to "PIP - Property of Cmdr. Taklu."
         #pip-nameplate-scuff the scratches over it — P6 wipes this clean at the payoff
         #pip-shards         three pips, opacity 0 until shards are collected (P7)
         #pip-antenna-bulb   pulses while PIP is talking -->
  <defs>
    <radialGradient id="pip-core-glow" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#fff0d0"/>
      <stop offset="46%" stop-color="#ffc46b"/>
      <stop offset="100%" stop-color="#e8792c"/>
    </radialGradient>
    <radialGradient id="pip-thruster-glow" cx="50%" cy="12%" r="80%">
      <stop offset="0%" stop-color="#bfefff" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#79d8ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#79d8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pip-ground" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#79d8ff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#79d8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse id="pip-ground-glow" cx="100" cy="216" rx="52" ry="11" fill="url(#pip-ground)"/>

  <g id="pip-float">
    <!-- thruster -->
    <g id="pip-thruster">
      <path d="M84 188h32l-6 18a4 4 0 0 1-3.6 2.4h-12.8A4 4 0 0 1 90 206z" fill="#9daabb"/>
      <path d="M84 188h16l-4 20.4h-2.4A4 4 0 0 1 90 206z" fill="#c3ceda"/>
      <ellipse cx="100" cy="212" rx="17" ry="12" fill="url(#pip-thruster-glow)"/>
    </g>

    <!-- arms -->
    <g id="pip-arm-l">
      <rect x="24" y="126" width="20" height="32" rx="10" fill="#9daabb"/>
      <rect x="24" y="126" width="10" height="32" rx="5" fill="#c3ceda"/>
    </g>
    <g id="pip-arm-r">
      <rect x="156" y="126" width="20" height="32" rx="10" fill="#9daabb"/>
      <rect x="156" y="126" width="9" height="32" rx="4.5" fill="#c3ceda"/>
    </g>

    <!-- body -->
    <g id="pip-body">
      <rect x="42" y="102" width="116" height="92" rx="34" fill="#c3ceda"/>
      <path d="M42 148v12a34 34 0 0 0 34 34h48a34 34 0 0 0 34-34v-12z" fill="#aab6c6"/>
      <path d="M76 102h20a48 48 0 0 0-30 30v-8a22 22 0 0 1 10-22z" fill="#eaf0f7" opacity="0.85"/>

      <!-- cracked memory core -->
      <circle cx="100" cy="134" r="26" fill="#8b98a9"/>
      <circle cx="100" cy="134" r="22" fill="#2f3849"/>
      <circle id="pip-core" cx="100" cy="134" r="18" fill="url(#pip-core-glow)"/>
      <g id="pip-core-crack" fill="none" stroke="#2a2118" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.86">
        <path d="M88 120l7 11-5 6 9 8-3 9"/>
        <path d="M95 131l10-3"/>
        <path d="M99 145l8 5"/>
      </g>
      <path d="M88 120l7 11-5 6 9 8-3 9" fill="none" stroke="#ffe6b8" stroke-width="0.9" stroke-linecap="round" opacity="0.5"/>
      <circle cx="100" cy="134" r="22" fill="none" stroke="#1f2735" stroke-width="2"/>

      <!-- memory-shard tally, revealed as shards are found -->
      <g id="pip-shards" opacity="0" fill="#f79ae0">
        <path d="M58 116l5 6-5 6-5-6z"/>
        <path d="M58 132l5 6-5 6-5-6z"/>
        <path d="M58 148l5 6-5 6-5-6z"/>
      </g>

      <!-- scuffed nameplate -->
      <g id="pip-nameplate">
        <rect x="63" y="166" width="74" height="19" rx="6" fill="#aab6c6" stroke="#8b98a9" stroke-width="1.4"/>
        <rect x="65.5" y="168.5" width="69" height="6" rx="3" fill="#cfd8e3" opacity="0.6"/>
        <text id="pip-nameplate-text" x="100" y="180" text-anchor="middle"
              font-family="system-ui, sans-serif" font-size="10.5" font-weight="700"
              letter-spacing="1.4" fill="#4a5566">P·P — ████</text>
        <g id="pip-nameplate-scuff" stroke="#dde5ee" stroke-linecap="round" opacity="0.85">
          <path d="M69 182l16-13" stroke-width="2.4"/>
          <path d="M92 181l13-11" stroke-width="1.8"/>
          <path d="M112 183l19-14" stroke-width="3"/>
          <path d="M78 172l9-4" stroke-width="1.4"/>
        </g>
      </g>
    </g>

    <!-- head -->
    <g id="pip-head">
      <g id="pip-antenna">
        <path d="M100 100V26" stroke="#9daabb" stroke-width="5" stroke-linecap="round" fill="none"/>
        <circle id="pip-antenna-bulb" cx="100" cy="20" r="8" fill="#f79ae0"/>
        <circle cx="97.5" cy="17.5" r="2.6" fill="#ffd9f6"/>
      </g>
      <rect x="44" y="30" width="112" height="80" rx="32" fill="#dfe6ef"/>
      <path d="M44 74v4a32 32 0 0 0 32 32h48a32 32 0 0 0 32-32v-4z" fill="#c3ceda"/>
      <path d="M76 30h18a44 44 0 0 0-28 26v-6a20 20 0 0 1 10-20z" fill="#f6f9fc" opacity="0.9"/>
      <rect x="56" y="46" width="88" height="48" rx="24" fill="#232c3c"/>
      <rect x="56" y="46" width="88" height="48" rx="24" fill="none" stroke="#151c28" stroke-width="2"/>
      <rect x="62" y="50" width="34" height="12" rx="6" fill="#3c4657" opacity="0.8"/>

      <g id="pip-eye-l"><rect x="76" y="60" width="14" height="19" rx="7" fill="#8fe9ff"/></g>
      <g id="pip-eye-r"><rect x="110" y="60" width="14" height="19" rx="7" fill="#8fe9ff"/></g>
      <path id="pip-mouth" d="M92 86q8 6 16 0" fill="none" stroke="#8fe9ff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    </g>
  </g>
</svg>
